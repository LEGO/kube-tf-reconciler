name: Build and Push Image to GHCR

on:
  pull_request:
    paths:
      - "**/*.go"
      - go.mod
      - .github/workflows/build-push.yml
      - Dockerfile
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  actions: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate build date
        id: date
        run: echo "BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Docker meta 📦
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}/kube-tf-reconciler
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=ref,event=pr
          flavor: |
            latest=false
  
      - name: Setup Docker Buildx 🛠️
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: jfrog/setup-jfrog-cli@4c2f06da03095113100534a16d58d8a252680949 # v5.3.5
        id: jfrog-cli
        env:
          JF_URL: https://artifactory.novus.legogroup.io
        with:
          oidc-provider-name: kube-tf-reconciler
          oidc-audience: lego-github

      - name: Login to JFrog 🐸
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: artifactory.novus.legogroup.io
          username: ${{ steps.jfrog-cli.outputs.oidc-user }}
          password: ${{ steps.jfrog-cli.outputs.oidc-token }}
      - name: Login to GHCR 🔑
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push 🚀
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # Keep the layers between runs. A PR run writes to its own cache scope only.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SHA=${{ github.sha }}
            DATE=${{ steps.date.outputs.BUILD_DATE }}
